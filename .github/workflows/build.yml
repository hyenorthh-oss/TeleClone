name: Build TeleClone APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare APK for GitHub Release
        run: cp app/build/outputs/apk/debug/app-debug.apk TeleClone-Final.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3
          name: TeleClone v1.3
          make_latest: true
          files: TeleClone-Final.apk
          body: |
            ## TeleClone v1.1

            Clonador nativo de canais e grupos do Telegram para Android (**Kotlin + Jetpack Compose + TDLib**).

            ### Novidades desta versão
            - **Clonagem Nuvem-a-Nuvem (`sendCopy = true`):** Cópia direta nos servidores do Telegram sem tag *"Encaminhado de..."* e sem download/re-upload de mídias no aparelho.
            - **Agrupamento de Álbuns:** Envio conjunto de mídias consecutivas com o mesmo `mediaAlbumId`.
            - **Execução Resiliente:** Persistência em Room para pausar/retomar do ponto exato (`lastClonedMessageId`) e tratamento automático de `FLOOD_WAIT`.
            - **Filtros & Customização:** Filtros de mídia, remoção opcional de `@menções`/links, assinatura personalizada e cadência anti-ban.

            ### Como instalar
            1. Baixe o arquivo **`TeleClone-v1.1.apk`** nos anexos abaixo.
            2. Autorize *"Instalar apps desconhecidos"* no Android caso solicitado.
            3. Crie seu `API_ID` e `API_HASH` em [my.telegram.org](https://my.telegram.org) e autentique no aplicativo.
